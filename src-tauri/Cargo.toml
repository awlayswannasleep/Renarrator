[package]
name = "renarrator"
version = "0.2.0"
description = "Key-trigger sound engine (background Tauri v2 app)"
authors = ["Renarrator"]
edition = "2021"
rust-version = "1.77.2"

# Tauri-приложение собирается как lib + маленький main.rs,
# который вызывает `renarrator_lib::run()`.
[lib]
name = "renarrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Глобальный перехват физических клавиш (WH_KEYBOARD_LL внутри, layout-independent Key enum)
rdev = "0.5.3"
# Аудио-движок: mp3 / wav / ogg(vorbis) включены в default-фичи
rodio = "0.22"
rand = "0.9"
thiserror = "2"
# Автозагрузка через HKCU\...\Run
winreg = "0.56"
# DWM blur-behind по скруглённому HRGN (честные закруглённые углы окна)
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
incremental = true

[profile.release]
lto = true
opt-level = 2
